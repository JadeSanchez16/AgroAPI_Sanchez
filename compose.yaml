services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrosierra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrosierra_dev}
      POSTGRES_USER: ${POSTGRES_USER:-agrosierra}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - agro_postgres_data:/var/lib/postgresql/data

volumes:
  agro_postgres_data:
