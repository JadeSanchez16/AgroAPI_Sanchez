services:
  api:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agrosierra}
      DB_USER: ${POSTGRES_USER:-agrosierra}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-agrosierra_dev}
      JWT_SECRET: ${JWT_SECRET:-AgroSierra-Desarrollo-Clave-Minimo-32-Bytes-2026}
    ports:
      - '${API_PORT:-8080}:8080'
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agrosierra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agrosierra_dev}
      POSTGRES_USER: ${POSTGRES_USER:-agrosierra}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - agro_postgres_data:/var/lib/postgresql/data

volumes:
  agro_postgres_data:
