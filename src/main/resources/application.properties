spring.application.name=AgroAPI
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agrosierra}
spring.datasource.username=${DB_USER:agrosierra}
spring.datasource.password=${DB_PASSWORD:agrosierra_dev}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.jackson.default-property-inclusion=non_null
server.error.include-message=never
agrosierra.jwt.secret=${JWT_SECRET:AgroSierra-Desarrollo-Clave-Minimo-32-Bytes-2026}
agrosierra.jwt.issuer=${JWT_ISSUER:agrosierra-api}
agrosierra.jwt.expiration-seconds=3600
